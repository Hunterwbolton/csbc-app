<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSBC — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: #1b1b1b;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      text-align: center;
      padding: 24px;
    }
    .offline-content h1 {
      font-size: 24px;
      margin-bottom: 12px;
    }
    .offline-content p {
      color: #a0a0a0;
      font-size: 16px;
      line-height: 1.6;
      max-width: 360px;
      margin: 0 auto 24px;
    }
    .retry-btn {
      display: inline-block;
      padding: 14px 28px;
      background: #c9a84c;
      color: #000;
      border: none;
      border-radius: 12px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
    }
    .offline-icon {
      margin-bottom: 20px;
      opacity: 0.4;
    }
  </style>
</head>
<body>
  <div class="offline-content">
    <svg class="offline-icon" width="64" height="64" fill="none" stroke="#fff" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
      <line x1="2" y1="2" x2="62" y2="62"/>
      <path d="M13.5 13.5A28 28 0 0 0 4 22"/>
      <path d="M60 22a28 28 0 0 0-8.8-7.5"/>
      <path d="M20 30a18 18 0 0 0-6 4"/>
      <path d="M50 34a18 18 0 0 0-4.7-3.5"/>
      <path d="M28 42a10 10 0 0 0-2 1.5"/>
      <path d="M38 43.5a10 10 0 0 0-1.2-.8"/>
      <circle cx="32" cy="52" r="2" fill="#fff"/>
    </svg>
    <h1>You're Offline</h1>
    <p>It looks like you've lost your internet connection. Please reconnect and try again.</p>
    <button class="retry-btn" onclick="location.reload()">Try Again</button>
  </div>
</body>
</html>
